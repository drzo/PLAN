<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperGraphiQL - cogpy Repository Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        input[type="text"] {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            padding: 15px 30px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            margin: 0;
            font-size: 14px;
        }

        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }

        .tab {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }

        .content {
            padding: 30px;
            min-height: 500px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .repo-card {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .repo-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .repo-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .repo-desc {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .repo-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.85em;
            color: #6c757d;
        }

        .language-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            background: #e7f3ff;
            color: #2196F3;
            font-weight: 600;
        }

        .feature-match {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }

        .feature-list {
            font-size: 0.85em;
            color: #2e7d32;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #6c757d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .analysis-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .analysis-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .feature-category {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .category-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .repo-list {
            list-style: none;
            padding-left: 0;
        }

        .repo-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .repo-list li:last-child {
            border-bottom: none;
        }

        .match-score {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 10px;
        }

        .score-high {
            background: #4caf50;
            color: white;
        }

        .score-medium {
            background: #ff9800;
            color: white;
        }

        .score-low {
            background: #9e9e9e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 HyperGraphiQL</h1>
            <p class="subtitle">Interactive Repository Analysis for cogpy Organization</p>
        </header>

        <div class="controls">
            <input type="text" id="githubToken" placeholder="GitHub Token (optional, for higher rate limits)" />
            <button class="btn btn-primary" onclick="fetchRepositories()">🔄 Fetch Repositories</button>
            <button class="btn btn-secondary" onclick="analyzeFeatures()">🔍 Analyze Features</button>
            <button class="btn btn-secondary" onclick="exportData()">💾 Export JSON</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview')">📊 Overview</button>
            <button class="tab" onclick="switchTab('repositories')">📦 Repositories</button>
            <button class="tab" onclick="switchTab('analysis')">🔬 Feature Analysis</button>
        </div>

        <div class="content">
            <div id="overview" class="tab-content active">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Click "Fetch Repositories" to load data from GitHub</p>
                </div>
            </div>

            <div id="repositories" class="tab-content">
                <div class="repo-grid" id="repoGrid"></div>
            </div>

            <div id="analysis" class="tab-content">
                <div class="analysis-section" id="analysisContent">
                    <p>Click "Analyze Features" after fetching repositories to see which repos match the kernel/OS spec features.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let repositories = [];
        
        // Kernel/OS feature keywords for analysis
        const featureKeywords = {
            'Boot/Init': ['boot', 'init', 'bootstrap', 'startup', 'loader', 'bootloader'],
            'CPU Scheduling': ['scheduler', 'scheduling', 'cpu', 'thread', 'task', 'process'],
            'Memory Management': ['memory', 'malloc', 'alloc', 'heap', 'stack', 'mmu', 'paging'],
            'Process Management': ['process', 'thread', 'fork', 'exec', 'pid', 'task'],
            'Interrupt Handling': ['interrupt', 'irq', 'trap', 'exception', 'handler'],
            'System Calls': ['syscall', 'system call', 'kernel api', 'interface'],
            'I/O Operations': ['io', 'input', 'output', 'device', 'driver', 'disk'],
            'Synchronization': ['mutex', 'semaphore', 'lock', 'sync', 'atomic', 'concurrent'],
            'Timer/Clock': ['timer', 'clock', 'time', 'rtc', 'tick'],
            'Security/Protection': ['security', 'protection', 'privilege', 'permission', 'access control']
        };

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 5000);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        async function fetchRepositories() {
            const token = document.getElementById('githubToken').value.trim();
            showStatus('Fetching repositories from GitHub...', 'info');
            
            const headers = {
                'Accept': 'application/vnd.github.v3+json',
                'User-Agent': 'HyperGraphiQL-Standalone'
            };
            
            if (token) {
                headers['Authorization'] = `token ${token}`;
            }
            
            try {
                repositories = [];
                let page = 1;
                let hasMore = true;
                
                while (hasMore && page <= 20) {
                    const response = await fetch(
                        `https://api.github.com/orgs/cogpy/repos?page=${page}&per_page=100&type=all`,
                        { headers }
                    );
                    
                    if (!response.ok) {
                        if (response.status === 403) {
                            const remaining = response.headers.get('X-RateLimit-Remaining');
                            const reset = response.headers.get('X-RateLimit-Reset');
                            if (remaining === '0') {
                                const resetDate = new Date(parseInt(reset) * 1000);
                                throw new Error(`Rate limit exceeded. Resets at ${resetDate.toLocaleTimeString()}. Add a GitHub token for higher limits.`);
                            }
                        }
                        throw new Error(`GitHub API error: ${response.status}`);
                    }
                    
                    const repos = await response.json();
                    repositories.push(...repos);
                    
                    hasMore = repos.length === 100;
                    page++;
                }
                
                showStatus(`✅ Successfully fetched ${repositories.length} repositories!`, 'success');
                renderOverview();
                renderRepositories();
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error('Fetch error:', error);
            }
        }

        function renderOverview() {
            const languages = {};
            const visibilities = {};
            
            repositories.forEach(repo => {
                const lang = repo.language || 'Unknown';
                languages[lang] = (languages[lang] || 0) + 1;
                
                const vis = repo.visibility || 'public';
                visibilities[vis] = (visibilities[vis] || 0) + 1;
            });
            
            const topLanguages = Object.entries(languages)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            
            const overview = document.getElementById('overview');
            overview.innerHTML = `
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value">${repositories.length}</div>
                        <div class="stat-label">Total Repositories</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${Object.keys(languages).length}</div>
                        <div class="stat-label">Languages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${visibilities.public || 0}</div>
                        <div class="stat-label">Public Repos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${visibilities.private || 0}</div>
                        <div class="stat-label">Private Repos</div>
                    </div>
                </div>
                
                <div class="analysis-section">
                    <div class="analysis-title">Top Languages</div>
                    ${topLanguages.map(([lang, count]) => `
                        <div style="margin-bottom: 10px;">
                            <strong>${lang}</strong>: ${count} repositories
                            <div style="background: #e0e0e0; height: 8px; border-radius: 4px; margin-top: 5px;">
                                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100%; width: ${(count / repositories.length) * 100}%; border-radius: 4px;"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderRepositories() {
            const grid = document.getElementById('repoGrid');
            grid.innerHTML = repositories.map(repo => `
                <div class="repo-card" onclick="window.open('${repo.html_url}', '_blank')">
                    <div class="repo-name">${repo.name}</div>
                    <div class="repo-desc">${repo.description || 'No description available'}</div>
                    <div class="repo-meta">
                        ${repo.language ? `<span class="language-badge">${repo.language}</span>` : ''}
                        <span>⭐ ${repo.stargazers_count}</span>
                        <span>🔱 ${repo.forks_count}</span>
                        <span>${repo.visibility || 'public'}</span>
                    </div>
                </div>
            `).join('');
        }

        function analyzeFeatures() {
            if (repositories.length === 0) {
                showStatus('❌ Please fetch repositories first!', 'error');
                return;
            }
            
            showStatus('🔍 Analyzing repositories for kernel/OS features...', 'info');
            
            const analysis = {};
            
            // Initialize analysis structure
            Object.keys(featureKeywords).forEach(feature => {
                analysis[feature] = [];
            });
            
            // Analyze each repository
            repositories.forEach(repo => {
                const searchText = `${repo.name} ${repo.description || ''} ${repo.language || ''}`.toLowerCase();
                
                Object.entries(featureKeywords).forEach(([feature, keywords]) => {
                    const matches = keywords.filter(keyword => searchText.includes(keyword.toLowerCase()));
                    
                    if (matches.length > 0) {
                        analysis[feature].push({
                            name: repo.name,
                            url: repo.html_url,
                            matches: matches,
                            score: matches.length,
                            description: repo.description
                        });
                    }
                });
            });
            
            // Sort by match score
            Object.keys(analysis).forEach(feature => {
                analysis[feature].sort((a, b) => b.score - a.score);
            });
            
            renderAnalysis(analysis);
            showStatus('✅ Feature analysis complete!', 'success');
        }

        function renderAnalysis(analysis) {
            const content = document.getElementById('analysisContent');
            
            let html = '<div class="analysis-title">Kernel/OS Feature Coverage Analysis</div>';
            
            Object.entries(analysis).forEach(([feature, repos]) => {
                if (repos.length > 0) {
                    html += `
                        <div class="feature-category">
                            <div class="category-title">
                                ${feature} 
                                <span style="color: #6c757d; font-weight: normal;">(${repos.length} repositories)</span>
                            </div>
                            <ul class="repo-list">
                                ${repos.slice(0, 10).map(repo => `
                                    <li>
                                        <a href="${repo.url}" target="_blank" style="color: #667eea; text-decoration: none;">
                                            <strong>${repo.name}</strong>
                                        </a>
                                        <span class="match-score ${getScoreClass(repo.score)}">
                                            ${repo.score} match${repo.score > 1 ? 'es' : ''}
                                        </span>
                                        <br>
                                        <small style="color: #6c757d;">
                                            Matched: ${repo.matches.join(', ')}
                                        </small>
                                        ${repo.description ? `<br><small style="color: #999;">${repo.description}</small>` : ''}
                                    </li>
                                `).join('')}
                                ${repos.length > 10 ? `<li style="color: #6c757d; font-style: italic;">... and ${repos.length - 10} more</li>` : ''}
                            </ul>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="feature-category" style="opacity: 0.6;">
                            <div class="category-title">${feature}</div>
                            <p style="color: #6c757d; font-style: italic;">No repositories found matching this feature</p>
                        </div>
                    `;
                }
            });
            
            content.innerHTML = html;
        }

        function getScoreClass(score) {
            if (score >= 3) return 'score-high';
            if (score >= 2) return 'score-medium';
            return 'score-low';
        }

        function exportData() {
            if (repositories.length === 0) {
                showStatus('❌ No data to export. Fetch repositories first!', 'error');
                return;
            }
            
            const dataStr = JSON.stringify(repositories, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `cogpy-repos-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            
            showStatus('✅ Data exported successfully!', 'success');
        }
    </script>
</body>
</html>
